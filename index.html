<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Skills Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #ffb6c1, #ffc0cb);
            height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        h2 {
            color: #ff4d88;
        }
    </style>
</head>

<p class="mt-3 text-muted">
    Account:<br>
    Username: <b>Shemaiah 
    Cabonilas</b><br>
    Password: <b>2811</b>
</p>

<body class="d-flex justify-content-center align-items-center">

<div class="login-card text-center">
    <h2>Login</h2>

    <p>Welcome to your Virtual Notebook</p>

    <input type="text" id="username" class="form-control mb-2" placeholder="Username">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-danger w-100" onclick="login()">Login</button>

    <p id="message" class="mt-3"></p>
</div>

<script>
    let attempts = 3;
    const correctUser = "Shemaiah Cabonilas";
    const correctPass = "2811";

    function login() {
        let user = document.getElementById("username").value;
        let pass = document.getElementById("password").value;

        if(user === correctUser && pass === correctPass){
            window.alert("Login Successful!");
            window.location.href = "notebook.html";
        } else {
            attempts--;
            document.getElementById("message").innerHTML =
                "Wrong credentials. Attempts left: " + attempts;

            if(attempts === 0){
                window.alert("No attempts left!");
                document.getElementById("message").innerHTML =
                "Account locked.";
            }
        }
    }
</script>

</body>
</html>
