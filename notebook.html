<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notebooks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fff0f5;
        }

        .sidebar {
            height: 100vh;
            background-color: #ff4d88;
            color: white;
            padding: 20px;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #ff4d88;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <div class="col-2 sidebar">
            <h4>Menu</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Notebooks</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Profile</a></li>
            </ul>
        </div>

        <div class="col-10 p-4">
            <h2>My Notebooks</h2>
            <p>Select a subject below:</p>

            <div class="row" id="subjects"></div>
        </div>

    </div>
</div>

<script>
    let subjects = ["Math", "English", "Science", "Filipino", "Social Studies", "Values"];

    let output = "";

    for(let i = 0; i < subjects.length; i++){
        output += `
        <div class="col-md-4 mb-3">
            <div class="card p-3 text-center">
                <h5>${subjects[i]}</h5>
                <p>Virtual Notebook</p>
                <button class="btn btn-danger" onclick="openSubject('${subjects[i]}')">
                    Open
                </button>
            </div>
        </div>
        `;
    }

    document.getElementById("subjects").innerHTML = output;

    function openSubject(subject){
        alert("Opening " + subject + " notebook...");
    }
</script>

</body>
</html>
